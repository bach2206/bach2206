<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <!-- Core gradient: dark edges, slightly lighter center suggesting distant light source -->
    <radialGradient id="voidGlow" cx="50%" cy="45%" r="55%" fx="50%" fy="40%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="40%" stop-color="#111111"/>
      <stop offset="85%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#030303"/>
    </radialGradient>

    <!-- Vertical fade for pillars receding into darkness above -->
    <linearGradient id="pillarFadeUp" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#222222"/>
      <stop offset="60%" stop-color="#151515"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </linearGradient>

    <!-- Vertical fade for pillars receding into darkness below -->
    <linearGradient id="pillarFadeDown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e1e"/>
      <stop offset="50%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle horizontal haze across the center -->
    <linearGradient id="horizonHaze" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Text glow filter -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Faint ambient glow for the central void -->
    <filter id="ambientGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
      </feMerge>
    </filter>

    <!-- Structural line noise filter -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="grained"/>
      <feComponentTransfer in="grained">
        <feFuncA type="linear" slope="1"/>
      </feComponentTransfer>
    </filter>

    <!-- Perspective lines vanishing point gradient -->
    <linearGradient id="perspectiveFade" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Deep structure gradient (for background layers) -->
    <linearGradient id="deepStructure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#060606"/>
    </linearGradient>

    <!-- Clip path for central corridor opening -->
    <clipPath id="corridorClip">
      <rect x="350" y="60" width="200" height="180"/>
    </clipPath>
  </defs>

  <!-- Base background: the void -->
  <rect width="900" height="300" fill="#050505"/>
  <rect width="900" height="300" fill="url(#voidGlow)"/>

  <!-- ===== DEEP BACKGROUND LAYER: Distant megastructure geometry ===== -->

  <!-- Far distant vertical structures (barely visible) -->
  <g opacity="0.08">
    <rect x="200" y="0" width="3" height="300" fill="#888"/>
    <rect x="280" y="0" width="1" height="300" fill="#666"/>
    <rect x="340" y="0" width="2" height="300" fill="#777"/>
    <rect x="420" y="20" width="1" height="260" fill="#555"/>
    <rect x="480" y="0" width="2" height="300" fill="#777"/>
    <rect x="560" y="0" width="1" height="300" fill="#666"/>
    <rect x="620" y="0" width="3" height="300" fill="#888"/>
    <rect x="700" y="0" width="1" height="300" fill="#555"/>
  </g>

  <!-- Distant horizontal platforms / walkways -->
  <g opacity="0.05">
    <rect x="180" y="95" width="540" height="1" fill="#aaa"/>
    <rect x="220" y="130" width="460" height="1" fill="#999"/>
    <rect x="250" y="170" width="400" height="1" fill="#888"/>
    <rect x="200" y="205" width="500" height="1" fill="#999"/>
  </g>

  <!-- ===== MID LAYER: Structural pillars and walls ===== -->

  <!-- Left megastructure wall cluster -->
  <g>
    <!-- Outermost left wall -->
    <rect x="0" y="0" width="85" height="300" fill="#0a0a0a"/>
    <rect x="85" y="0" width="2" height="300" fill="#1a1a1a"/>

    <!-- Left pillar group -->
    <rect x="95" y="0" width="35" height="300" fill="url(#deepStructure)"/>
    <rect x="130" y="0" width="1" height="300" fill="#1c1c1c"/>
    <rect x="138" y="0" width="18" height="300" fill="#0c0c0c"/>
    <rect x="156" y="0" width="1" height="300" fill="#181818"/>

    <!-- Left secondary pillars -->
    <rect x="165" y="0" width="8" height="300" fill="#0e0e0e"/>
    <rect x="180" y="0" width="4" height="300" fill="#0b0b0b"/>
    <rect x="190" y="0" width="12" height="300" fill="#0d0d0d"/>
    <rect x="202" y="0" width="1" height="300" fill="#1a1a1a"/>

    <!-- Left thin structural lines -->
    <rect x="210" y="0" width="2" height="300" fill="#111111"/>
    <rect x="220" y="0" width="1" height="300" fill="#0f0f0f"/>
    <rect x="228" y="0" width="5" height="300" fill="#0c0c0c"/>
    <rect x="240" y="0" width="1" height="300" fill="#141414"/>
    <rect x="250" y="0" width="3" height="300" fill="#0e0e0e"/>
    <rect x="260" y="0" width="1" height="300" fill="#111111"/>
    <rect x="270" y="30" width="2" height="240" fill="#0d0d0d"/>
    <rect x="285" y="50" width="1" height="200" fill="#101010"/>
  </g>

  <!-- Right megastructure wall cluster (mirrored) -->
  <g>
    <!-- Outermost right wall -->
    <rect x="815" y="0" width="85" height="300" fill="#0a0a0a"/>
    <rect x="813" y="0" width="2" height="300" fill="#1a1a1a"/>

    <!-- Right pillar group -->
    <rect x="770" y="0" width="35" height="300" fill="url(#deepStructure)"/>
    <rect x="769" y="0" width="1" height="300" fill="#1c1c1c"/>
    <rect x="744" y="0" width="18" height="300" fill="#0c0c0c"/>
    <rect x="743" y="0" width="1" height="300" fill="#181818"/>

    <!-- Right secondary pillars -->
    <rect x="727" y="0" width="8" height="300" fill="#0e0e0e"/>
    <rect x="716" y="0" width="4" height="300" fill="#0b0b0b"/>
    <rect x="698" y="0" width="12" height="300" fill="#0d0d0d"/>
    <rect x="697" y="0" width="1" height="300" fill="#1a1a1a"/>

    <!-- Right thin structural lines -->
    <rect x="688" y="0" width="2" height="300" fill="#111111"/>
    <rect x="679" y="0" width="1" height="300" fill="#0f0f0f"/>
    <rect x="667" y="0" width="5" height="300" fill="#0c0c0c"/>
    <rect x="659" y="0" width="1" height="300" fill="#141414"/>
    <rect x="647" y="0" width="3" height="300" fill="#0e0e0e"/>
    <rect x="639" y="0" width="1" height="300" fill="#111111"/>
    <rect x="628" y="30" width="2" height="240" fill="#0d0d0d"/>
    <rect x="614" y="50" width="1" height="200" fill="#101010"/>
  </g>

  <!-- ===== FOREGROUND PILLARS: Closest structures framing the corridor ===== -->

  <!-- Left foreground massive pillar -->
  <rect x="0" y="0" width="60" height="300" fill="#070707"/>
  <rect x="60" y="0" width="3" height="300" fill="#161616"/>
  <rect x="63" y="0" width="15" height="300" fill="#090909"/>
  <rect x="78" y="0" width="1" height="300" fill="#1e1e1e"/>

  <!-- Right foreground massive pillar -->
  <rect x="840" y="0" width="60" height="300" fill="#070707"/>
  <rect x="837" y="0" width="3" height="300" fill="#161616"/>
  <rect x="822" y="0" width="15" height="300" fill="#090909"/>
  <rect x="821" y="0" width="1" height="300" fill="#1e1e1e"/>

  <!-- ===== HORIZONTAL STRUCTURAL ELEMENTS ===== -->

  <!-- Upper horizontal beams / ceiling structures -->
  <g opacity="0.7">
    <rect x="0" y="0" width="900" height="25" fill="#060606"/>
    <rect x="0" y="25" width="300" height="2" fill="#141414"/>
    <rect x="600" y="25" width="300" height="2" fill="#141414"/>
    <rect x="0" y="35" width="250" height="15" fill="#080808"/>
    <rect x="650" y="35" width="250" height="15" fill="#080808"/>
    <rect x="250" y="35" width="400" height="1" fill="#111111"/>
  </g>

  <!-- Lower horizontal beams / floor structures -->
  <g opacity="0.7">
    <rect x="0" y="275" width="900" height="25" fill="#060606"/>
    <rect x="0" y="273" width="300" height="2" fill="#141414"/>
    <rect x="600" y="273" width="300" height="2" fill="#141414"/>
    <rect x="0" y="255" width="250" height="15" fill="#080808"/>
    <rect x="650" y="255" width="250" height="15" fill="#080808"/>
    <rect x="250" y="269" width="400" height="1" fill="#111111"/>
  </g>

  <!-- Mid-level walkway/platform hints -->
  <g opacity="0.12">
    <line x1="80" y1="100" x2="300" y2="100" stroke="#999" stroke-width="0.5"/>
    <line x1="600" y1="100" x2="820" y2="100" stroke="#999" stroke-width="0.5"/>
    <line x1="80" y1="200" x2="300" y2="200" stroke="#999" stroke-width="0.5"/>
    <line x1="600" y1="200" x2="820" y2="200" stroke="#999" stroke-width="0.5"/>
  </g>

  <!-- ===== PERSPECTIVE LINES: Converging toward vanishing point ===== -->
  <g opacity="0.04">
    <!-- Lines converging from left -->
    <line x1="0" y1="0" x2="450" y2="140" stroke="#ccc" stroke-width="0.5"/>
    <line x1="0" y1="50" x2="450" y2="145" stroke="#ccc" stroke-width="0.3"/>
    <line x1="0" y1="100" x2="450" y2="148" stroke="#ccc" stroke-width="0.3"/>
    <line x1="0" y1="300" x2="450" y2="160" stroke="#ccc" stroke-width="0.5"/>
    <line x1="0" y1="250" x2="450" y2="155" stroke="#ccc" stroke-width="0.3"/>
    <line x1="0" y1="200" x2="450" y2="152" stroke="#ccc" stroke-width="0.3"/>

    <!-- Lines converging from right -->
    <line x1="900" y1="0" x2="450" y2="140" stroke="#ccc" stroke-width="0.5"/>
    <line x1="900" y1="50" x2="450" y2="145" stroke="#ccc" stroke-width="0.3"/>
    <line x1="900" y1="100" x2="450" y2="148" stroke="#ccc" stroke-width="0.3"/>
    <line x1="900" y1="300" x2="450" y2="160" stroke="#ccc" stroke-width="0.5"/>
    <line x1="900" y1="250" x2="450" y2="155" stroke="#ccc" stroke-width="0.3"/>
    <line x1="900" y1="200" x2="450" y2="152" stroke="#ccc" stroke-width="0.3"/>
  </g>

  <!-- ===== CIRCUIT / STRUCTURAL DETAIL PATTERNS ===== -->

  <!-- Left wall circuit patterns -->
  <g opacity="0.06" stroke="#aaa" fill="none" stroke-width="0.5">
    <!-- Vertical conduit lines -->
    <line x1="70" y1="30" x2="70" y2="120"/>
    <line x1="70" y1="120" x2="90" y2="120"/>
    <line x1="90" y1="120" x2="90" y2="180"/>
    <line x1="90" y1="180" x2="70" y2="180"/>
    <line x1="70" y1="180" x2="70" y2="270"/>

    <!-- Small junction nodes -->
    <rect x="67" y="118" width="6" height="4"/>
    <rect x="87" y="178" width="6" height="4"/>

    <!-- Horizontal conduit -->
    <line x1="100" y1="80" x2="170" y2="80"/>
    <line x1="170" y1="80" x2="170" y2="110"/>
    <line x1="170" y1="110" x2="140" y2="110"/>
    <rect x="137" y="107" width="6" height="6"/>

    <line x1="100" y1="220" x2="160" y2="220"/>
    <line x1="160" y1="220" x2="160" y2="245"/>
    <rect x="157" y="242" width="6" height="6"/>
  </g>

  <!-- Right wall circuit patterns (mirrored) -->
  <g opacity="0.06" stroke="#aaa" fill="none" stroke-width="0.5">
    <line x1="830" y1="30" x2="830" y2="120"/>
    <line x1="830" y1="120" x2="810" y2="120"/>
    <line x1="810" y1="120" x2="810" y2="180"/>
    <line x1="810" y1="180" x2="830" y2="180"/>
    <line x1="830" y1="180" x2="830" y2="270"/>

    <rect x="827" y="118" width="6" height="4"/>
    <rect x="807" y="178" width="6" height="4"/>

    <line x1="800" y1="80" x2="730" y2="80"/>
    <line x1="730" y1="80" x2="730" y2="110"/>
    <line x1="730" y1="110" x2="760" y2="110"/>
    <rect x="757" y="107" width="6" height="6"/>

    <line x1="800" y1="220" x2="740" y2="220"/>
    <line x1="740" y1="220" x2="740" y2="245"/>
    <rect x="737" y="242" width="6" height="6"/>
  </g>

  <!-- ===== CENTRAL VOID: The corridor stretching to infinity ===== -->

  <!-- Faint light source deep in the corridor -->
  <ellipse cx="450" cy="150" rx="80" ry="40" fill="#ffffff" opacity="0.015" filter="url(#ambientGlow)"/>
  <ellipse cx="450" cy="150" rx="30" ry="15" fill="#ffffff" opacity="0.02"/>

  <!-- Horizontal haze band across center -->
  <rect x="0" y="135" width="900" height="30" fill="url(#horizonHaze)"/>

  <!-- ===== TINY STRUCTURAL DETAILS scattered in the void ===== -->

  <!-- Small distant structures visible in the corridor -->
  <g opacity="0.08">
    <!-- Distant vertical elements in center -->
    <rect x="390" y="90" width="1" height="40" fill="#666"/>
    <rect x="410" y="80" width="1" height="55" fill="#555"/>
    <rect x="430" y="95" width="1" height="30" fill="#777"/>
    <rect x="460" y="85" width="1" height="45" fill="#555"/>
    <rect x="490" y="90" width="1" height="35" fill="#666"/>
    <rect x="510" y="80" width="1" height="50" fill="#555"/>

    <!-- Distant horizontal connections -->
    <rect x="390" y="110" width="120" height="0.5" fill="#555"/>
    <rect x="410" y="95" width="100" height="0.5" fill="#444"/>

    <!-- Tiny distant structures below center -->
    <rect x="395" y="175" width="1" height="35" fill="#555"/>
    <rect x="425" y="170" width="1" height="45" fill="#666"/>
    <rect x="470" y="175" width="1" height="40" fill="#555"/>
    <rect x="505" y="170" width="1" height="35" fill="#666"/>
    <rect x="395" y="190" width="110" height="0.5" fill="#444"/>
  </g>

  <!-- ===== VERTICAL ACCENT LINES: Scale markers ===== -->
  <g opacity="0.03">
    <line x1="300" y1="0" x2="300" y2="300" stroke="#fff" stroke-width="0.3" stroke-dasharray="2,8"/>
    <line x1="350" y1="0" x2="350" y2="300" stroke="#fff" stroke-width="0.3" stroke-dasharray="1,12"/>
    <line x1="550" y1="0" x2="550" y2="300" stroke="#fff" stroke-width="0.3" stroke-dasharray="1,12"/>
    <line x1="600" y1="0" x2="600" y2="300" stroke="#fff" stroke-width="0.3" stroke-dasharray="2,8"/>
  </g>

  <!-- ===== SCATTERED LIGHT POINTS: Distant windows/openings ===== -->
  <g>
    <rect x="312" y="88" width="2" height="1" fill="#ffffff" opacity="0.06"/>
    <rect x="585" y="92" width="2" height="1" fill="#ffffff" opacity="0.05"/>
    <rect x="290" y="195" width="1" height="2" fill="#ffffff" opacity="0.04"/>
    <rect x="608" y="190" width="1" height="2" fill="#ffffff" opacity="0.05"/>
    <rect x="340" y="140" width="1" height="1" fill="#ffffff" opacity="0.07"/>
    <rect x="558" y="145" width="1" height="1" fill="#ffffff" opacity="0.06"/>
    <rect x="375" y="165" width="1" height="1" fill="#ffffff" opacity="0.04"/>
    <rect x="523" y="160" width="1" height="1" fill="#ffffff" opacity="0.05"/>
  </g>

  <!-- ===== GRAIN OVERLAY for texture ===== -->
  <rect width="900" height="300" fill="url(#voidGlow)" opacity="0.3" filter="url(#grain)"/>

  <!-- ===== USERNAME TEXT: "bach2206" ===== -->

  <!-- Text shadow/glow layers -->
  <text x="450" y="157"
    font-family="'Courier New', 'Consolas', 'SF Mono', 'Liberation Mono', monospace"
    font-size="22"
    font-weight="400"
    letter-spacing="12"
    text-anchor="middle"
    fill="#ffffff"
    opacity="0.06"
    filter="url(#ambientGlow)">
    bach2206
  </text>

  <!-- Main text with subtle presence -->
  <text x="450" y="157"
    font-family="'Courier New', 'Consolas', 'SF Mono', 'Liberation Mono', monospace"
    font-size="22"
    font-weight="400"
    letter-spacing="12"
    text-anchor="middle"
    fill="#ffffff"
    opacity="0.28"
    filter="url(#textGlow)">
    bach2206
  </text>

  <!-- Thin horizontal rules flanking the text -->
  <line x1="310" y1="148" x2="370" y2="148" stroke="#ffffff" stroke-width="0.3" opacity="0.1"/>
  <line x1="530" y1="148" x2="590" y2="148" stroke="#ffffff" stroke-width="0.3" opacity="0.1"/>

  <!-- Small decorative marks at text line ends -->
  <rect x="308" y="146" width="2" height="4" fill="#ffffff" opacity="0.08"/>
  <rect x="590" y="146" width="2" height="4" fill="#ffffff" opacity="0.08"/>

  <!-- ===== EDGE VIGNETTE: Darken edges further ===== -->
  <rect width="900" height="300" fill="url(#voidGlow)" opacity="0.4"/>

  <!-- Top edge darkness -->
  <rect x="0" y="0" width="900" height="40" fill="#030303" opacity="0.6"/>
  <!-- Bottom edge darkness -->
  <rect x="0" y="260" width="900" height="40" fill="#030303" opacity="0.6"/>
</svg>